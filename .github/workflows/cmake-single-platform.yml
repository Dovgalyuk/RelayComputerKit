name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get install kicad texlive-latex-base texlive-latex-extra texlive-latex-recommended texlive-lang-cyrillic

    - name: Build all
      run: ./build_all.sh
